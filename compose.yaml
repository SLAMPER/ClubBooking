services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity:
    build:
      context: .
      dockerfile: ClubBooking.Identity/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Database=identity_db;Username=postgres;Password=postgres
      Jwt__Key: club-booking-demo-key-for-docker-compose-2026
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy

  seats:
    build:
      context: .
      dockerfile: ClubBooking.Seats/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Database=seats_db;Username=postgres;Password=postgres
      Jwt__Key: club-booking-demo-key-for-docker-compose-2026
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bookings:
    build:
      context: .
      dockerfile: ClubBooking.Bookings/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Database=bookings_db;Username=postgres;Password=postgres
      Jwt__Key: club-booking-demo-key-for-docker-compose-2026
      Services__Seats: http://seats:8080
      Club__TimeZone: Europe/Moscow
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seats:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: ClubBooking.Web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - seats
      - bookings

volumes:
  pgdata:
